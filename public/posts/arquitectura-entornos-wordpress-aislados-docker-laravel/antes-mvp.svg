<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura del MVP</title>
  <desc id="d">Laravel, el worker de la cola y un servidor php -S por sitio corren con el mismo usuario del sistema, así que el código de cualquier sitio puede leer el .env y los archivos de la aplicación.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#737373"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ef4444"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
      .h{fill:#f5f5f5;font-size:15px;font-weight:600}
      .s{fill:#a3a3a3;font-size:12px}
      .m{fill:#737373;font-size:11px}
      .cap{font-size:11px;font-weight:600;letter-spacing:.08em}
      .box{fill:#171717;stroke:#333;stroke-width:1}
    </style>
  </defs>

  <rect width="1000" height="440" rx="16" fill="#111111"/>
  <rect x=".5" y=".5" width="999" height="439" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <text x="40" y="44" class="sans" fill="#e5e5e5" font-size="16" font-weight="600">Antes: el MVP</text>
  <text x="960" y="44" class="sans s" text-anchor="end">todo comparte usuario, archivos y secretos</text>

  <!-- Frontera: un solo usuario -->
  <rect x="40" y="68" width="920" height="292" rx="12" fill="#ef4444" fill-opacity=".04" stroke="#ef4444" stroke-opacity=".55" stroke-dasharray="6 5"/>
  <text x="60" y="94" class="sans cap" fill="#f87171">UN SOLO USUARIO DEL SISTEMA · ROOT EN DOCKER</text>

  <!-- Laravel -->
  <rect x="64" y="114" width="270" height="96" rx="10" class="box" stroke="#3077c7" stroke-opacity=".7"/>
  <text x="84" y="144" class="sans h">Laravel</text>
  <text x="152" y="144" class="sans m">FrankenPHP</text>
  <text x="84" y="170" class="mono s">.env · APP_KEY · API keys</text>
  <text x="84" y="192" class="mono s">BD de la app · código</text>

  <!-- Worker -->
  <rect x="64" y="236" width="270" height="96" rx="10" class="box"/>
  <text x="84" y="266" class="sans h">Worker de la cola</text>
  <text x="84" y="292" class="sans s">instala, siembra y exporta</text>
  <text x="84" y="314" class="sans m">ejecuta WP-CLI en local</text>

  <!-- Flecha WP-CLI -->
  <line x1="334" y1="284" x2="412" y2="284" stroke="#737373" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="373" y="274" class="mono m" text-anchor="middle">WP-CLI</text>

  <!-- Sitios -->
  <g>
    <rect x="420" y="236" width="164" height="96" rx="10" class="box" stroke="#f59e0b" stroke-opacity=".6"/>
    <text x="440" y="266" class="mono h" font-size="14">php -S :8101</text>
    <text x="440" y="292" class="sans s">sitio A</text>
    <text x="440" y="314" class="sans m" fill="#d97706">plugins del cliente</text>
  </g>
  <g>
    <rect x="598" y="236" width="164" height="96" rx="10" class="box" stroke="#f59e0b" stroke-opacity=".6"/>
    <text x="618" y="266" class="mono h" font-size="14">php -S :8102</text>
    <text x="618" y="292" class="sans s">sitio B</text>
    <text x="618" y="314" class="sans m" fill="#d97706">plugins del cliente</text>
  </g>
  <g>
    <rect x="776" y="236" width="164" height="96" rx="10" class="box" stroke="#f59e0b" stroke-opacity=".6"/>
    <text x="796" y="266" class="mono h" font-size="14">php -S :8103</text>
    <text x="796" y="292" class="sans s">sitio C</text>
    <text x="796" y="314" class="sans m" fill="#d97706">plugins del cliente</text>
  </g>

  <!-- Acceso no deseado -->
  <path d="M680 236 C680 170 520 162 338 162" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-red)"/>
  <text x="560" y="148" class="sans" fill="#f87171" font-size="12" text-anchor="middle">cualquier plugin lee .env, el código y los otros sitios</text>

  <!-- Conclusión -->
  <text x="500" y="400" class="sans" font-size="14" text-anchor="middle" fill="#a3a3a3">Administrador de WordPress <tspan fill="#e5e5e5" font-weight="600">=</tspan> ejecución de PHP <tspan fill="#e5e5e5" font-weight="600">=</tspan> <tspan fill="#f87171" font-weight="600">el mismo usuario que Laravel</tspan></text>
</svg>
