<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura con entornos aislados</title>
  <desc id="d">Traefik recibe el tráfico y lo pasa al contenedor de la aplicación. Caddy enruta el dominio de la app a Laravel y los dominios de vista previa a los contenedores de cada sitio tras validar con forward_auth. Laravel habla con el site runner por HTTP con token; solo el runner tiene el socket de Docker y crea los contenedores de los sitios, que corren como www-data, en solo lectura y sin red externa.</desc>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#737373"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b9be0"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f59e0b"/>
    </marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a78bfa"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
      .h{fill:#f5f5f5;font-size:15px;font-weight:600}
      .s{fill:#a3a3a3;font-size:12px}
      .m{fill:#737373;font-size:11px}
      .cap{font-size:11px;font-weight:600;letter-spacing:.08em}
      .box{fill:#171717;stroke:#333;stroke-width:1}
    </style>
  </defs>

  <rect width="1000" height="740" rx="16" fill="#111111"/>
  <rect x=".5" y=".5" width="999" height="739" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <text x="40" y="44" class="sans" fill="#e5e5e5" font-size="16" font-weight="600">Después: un contenedor por sitio</text>
  <text x="960" y="44" class="sans s" text-anchor="end">Laravel orquesta, el runner actúa, el sitio solo sirve</text>

  <!-- Internet y Traefik -->
  <rect x="440" y="66" width="120" height="32" rx="16" fill="#171717" stroke="#404040"/>
  <text x="500" y="87" class="sans s" text-anchor="middle" fill="#d4d4d4">Internet</text>
  <line x1="500" y1="98" x2="500" y2="118" stroke="#737373" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="410" y="120" width="180" height="44" rx="8" class="box"/>
  <text x="500" y="140" class="sans h" font-size="14" text-anchor="middle">Traefik</text>
  <text x="500" y="156" class="sans m" text-anchor="middle">TLS · HTTPS</text>
  <line x1="500" y1="164" x2="500" y2="190" stroke="#737373" stroke-width="1.5" marker-end="url(#a-gray)"/>

  <!-- Contenedor de la aplicación -->
  <rect x="40" y="192" width="920" height="196" rx="12" fill="#3077c7" fill-opacity=".05" stroke="#3077c7" stroke-opacity=".55"/>
  <text x="60" y="218" class="sans cap" fill="#5b9be0">CONTENEDOR DE LA APLICACIÓN</text>
  <text x="940" y="218" class="mono m" text-anchor="end">Caddy / FrankenPHP</text>

  <!-- Ruta app -->
  <rect x="64" y="238" width="290" height="44" rx="8" fill="#0d0d0d" stroke="#333"/>
  <text x="80" y="265" class="mono s" fill="#d4d4d4">app.midominio.com</text>
  <line x1="354" y1="260" x2="672" y2="260" stroke="#5b9be0" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- Ruta preview -->
  <rect x="64" y="304" width="290" height="44" rx="8" fill="#0d0d0d" stroke="#333"/>
  <text x="80" y="331" class="mono s" fill="#d4d4d4">s-{uuid}.d2p-preview.com</text>
  <line x1="354" y1="326" x2="408" y2="326" stroke="#737373" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="410" y="304" width="170" height="44" rx="8" class="box"/>
  <text x="495" y="331" class="mono" font-size="13" fill="#f5f5f5" text-anchor="middle">forward_auth</text>
  <line x1="580" y1="326" x2="672" y2="326" stroke="#5b9be0" stroke-width="1.5" stroke-dasharray="4 3" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>
  <text x="626" y="316" class="sans m" text-anchor="middle">¿es miembro?</text>

  <!-- Laravel -->
  <rect x="674" y="238" width="262" height="110" rx="10" class="box" stroke="#3077c7" stroke-opacity=".8"/>
  <text x="694" y="268" class="sans h">Laravel</text>
  <text x="694" y="292" class="sans s">Panel · Studio · IA · cola · exports</text>
  <text x="694" y="314" class="mono m">/__d2p/verify: 204 o 401</text>
  <text x="694" y="334" class="sans m">nunca ejecuta código de un sitio</text>

  <!-- Red de sitios -->
  <rect x="40" y="440" width="600" height="210" rx="12" fill="#f59e0b" fill-opacity=".03" stroke="#f59e0b" stroke-opacity=".45" stroke-dasharray="6 5"/>
  <text x="60" y="466" class="sans cap" fill="#fbbf24">RED d2p-sites</text>
  <text x="166" y="466" class="mono m">--internal · sin internet · sin vecinos</text>

  <!-- Flecha proxy a sitios -->
  <line x1="495" y1="348" x2="495" y2="486" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a-amber)"/>
  <rect x="506" y="398" width="138" height="22" rx="4" fill="#111111"/>
  <text x="512" y="413" class="mono m" fill="#d4d4d4">reverse_proxy :8080</text>

  <g>
    <rect x="60" y="488" width="176" height="142" rx="10" class="box" stroke="#f59e0b" stroke-opacity=".6"/>
    <text x="78" y="516" class="mono h" font-size="13">d2p-site-A</text>
    <text x="78" y="544" class="sans s">www-data · uid 82</text>
    <text x="78" y="566" class="sans s">rootfs read-only</text>
    <text x="78" y="588" class="sans s">CapDrop ALL</text>
    <text x="78" y="610" class="sans m">384 MB · 1 CPU · 256 PIDs</text>
  </g>
  <g>
    <rect x="252" y="488" width="176" height="142" rx="10" class="box" stroke="#f59e0b" stroke-opacity=".6"/>
    <text x="270" y="516" class="mono h" font-size="13">d2p-site-B</text>
    <text x="270" y="544" class="sans s">www-data · uid 82</text>
    <text x="270" y="566" class="sans s">rootfs read-only</text>
    <text x="270" y="588" class="sans s">CapDrop ALL</text>
    <text x="270" y="610" class="sans m">384 MB · 1 CPU · 256 PIDs</text>
  </g>
  <g>
    <rect x="444" y="488" width="176" height="142" rx="10" class="box" stroke="#f59e0b" stroke-opacity=".6"/>
    <text x="462" y="516" class="mono h" font-size="13">d2p-site-C</text>
    <text x="462" y="544" class="sans s">www-data · uid 82</text>
    <text x="462" y="566" class="sans s">rootfs read-only</text>
    <text x="462" y="588" class="sans s">CapDrop ALL</text>
    <text x="462" y="610" class="sans m">384 MB · 1 CPU · 256 PIDs</text>
  </g>

  <!-- Red del runner -->
  <rect x="660" y="440" width="300" height="210" rx="12" fill="#a78bfa" fill-opacity=".04" stroke="#a78bfa" stroke-opacity=".45" stroke-dasharray="6 5"/>
  <text x="680" y="466" class="sans cap" fill="#c4b5fd">RED d2p-runner</text>

  <!-- Laravel -> runner -->
  <line x1="805" y1="348" x2="805" y2="486" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-violet)"/>
  <rect x="816" y="398" width="96" height="22" rx="4" fill="#111111"/>
  <text x="822" y="413" class="mono m" fill="#d4d4d4">HTTP + token</text>

  <rect x="684" y="488" width="252" height="74" rx="10" class="box" stroke="#a78bfa" stroke-opacity=".8"/>
  <text x="704" y="516" class="sans h">Site runner</text>
  <text x="704" y="540" class="sans s">PHP plano · API de acciones</text>

  <line x1="810" y1="562" x2="810" y2="584" stroke="#737373" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <rect x="684" y="586" width="252" height="44" rx="8" fill="#ef4444" fill-opacity=".08" stroke="#ef4444" stroke-opacity=".6"/>
  <text x="810" y="613" class="mono" font-size="12" fill="#fca5a5" text-anchor="middle">/var/run/docker.sock</text>

  <!-- Runner -> sitios -->
  <line x1="684" y1="608" x2="624" y2="608" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a-violet)"/>

  <!-- Leyenda -->
  <g class="sans" font-size="12" fill="#a3a3a3">
    <rect x="40" y="686" width="12" height="12" rx="3" fill="#3077c7"/>
    <text x="60" y="697">Código propio</text>
    <rect x="180" y="686" width="12" height="12" rx="3" fill="#f59e0b"/>
    <text x="200" y="697">Código del cliente, aislado</text>
    <rect x="390" y="686" width="12" height="12" rx="3" fill="#a78bfa"/>
    <text x="410" y="697">Orquestación (crea contenedores, ejecuta WP-CLI)</text>
    <rect x="740" y="686" width="12" height="12" rx="3" fill="#ef4444"/>
    <text x="760" y="697">Equivale a root en el host</text>
  </g>
</svg>
